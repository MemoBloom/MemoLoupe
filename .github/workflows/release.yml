# 发布工作流：tag push → 构建产物 → 附加到 GitHub Release。
# Homebrew formula 以 Release 资产（sdist）作为稳定下载源：
# GitHub 自动生成的 archive tarball 校验和不保证稳定，不用于 formula。
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Build sdist & wheel
        run: uv build

      - name: Create GitHub Release with artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/memoloupe-*.tar.gz dist/memoloupe-*.whl
