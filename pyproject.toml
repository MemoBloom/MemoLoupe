[project]
name = "memoloupe"
version = "0.1.1"
description = "MemoLoupe: staged reference-video analysis (shot / story / style profile)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.23",
    "numpy>=2.5.2",
]

[project.scripts]
memoloupe = "memoloupe.cli.main:main"

[project.optional-dependencies]
asr-local = ["fireredvad", "mlx-whisper>=0.4.3"]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memoloupe"]

# 数据目录随 wheel 分发（安装后由 memoloupe.core.packaged 解析）：
# 源码运行时包内不存在这些目录，自动回退仓库根。
[tool.hatch.build.targets.wheel.force-include]
"schemas" = "memoloupe/schemas"
"rules" = "memoloupe/rules"
"templates" = "memoloupe/templates"
"assets" = "memoloupe/assets"
"helpers" = "memoloupe/helpers"

[tool.pytest.ini_options]
testpaths = ["tests"]
