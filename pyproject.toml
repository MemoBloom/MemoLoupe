[project]
name = "memoloupe"
version = "0.1.0"
description = "MemoLoupe: staged reference-video analysis (shot / story / style profile)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.23",
    "numpy>=2.5.2",
]

[project.scripts]
memoloupe = "memoloupe.cli.main:main"

[project.optional-dependencies]
asr-local = ["fireredvad", "mlx-whisper>=0.4.3"]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memoloupe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
