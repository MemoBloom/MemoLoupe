<!DOCTYPE html>
<html lang="zh-CN" data-document-type="shotAnalysis" data-document-status="__DOCUMENT_STATUS__" data-contract-version="__CONTRACT_VERSION__" data-source-revision="__SOURCE_REVISION__" data-render-version="__SHOT_RENDER_VERSION__">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; media-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>MemoLoupe 镜头拉片校对台</title>
<style>
  :root {
    color-scheme: light;
    --background: #f7f2e6;
    --foreground: #1c2333;
    --card: #fffdf8;
    --card-foreground: #1c2333;
    --popover: #fffdf8;

    --accent: #f0e6cf;
    --accent-foreground: #1c2333;
    --brand: #a57100;
    --brand-foreground: #fffdf8;

  }
  button, input, select { font: inherit; }
  button {
    min-height: 34px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--secondary);
    color: var(--secondary-foreground);
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: var(--accent); }

    color: var(--primary-foreground);

  .skip-link:focus { transform: translateY(0); }

    display: grid;
    grid-template-columns: minmax(0, 1fr) 360px;
    gap: 18px;
    min-height: 100vh;
    padding: 20px;
  }
  .main-shell {
    display: flex;
    min-width: 0;
    flex-direction: column;
    gap: 18px;
  }
  .card {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: rgba(255, 253, 248, 0.94);
    color: var(--card-foreground);
    box-shadow: var(--shadow);
  }
  .card-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    padding: 18px 18px 0;
  }
  .card-title {
    margin: 0;
    font-size: 15px;
    font-weight: 650;
    letter-spacing: -0.01em;
  }
  .card-description {
    margin: 6px 0 0;
    color: var(--muted-foreground);

    font-size: 11px;
    font-weight: 650;
    white-space: nowrap;

  .badge-outline { background: transparent; color: var(--muted-foreground); }
  .badge-warning { border-color: var(--warning-border); color: var(--warning); }
  .badge-success { border-color: var(--success-border); color: var(--success); }
  .badge-destructive { border-color: var(--destructive-border); color: var(--destructive); }
  .metadata {

    z-index: 2;
    padding: 22px;
    backdrop-filter: blur(16px);

  .metadata-topline {

  }
  .brand-logo {

  .metadata h1 {

    font-size: 20px;

  .metadata-grid-tech {
    grid-template-columns: repeat(3, minmax(0, 1fr));

  }
  .review-grid {

  }
  .player-card {
    position: sticky;
    top: 176px;
    overflow: hidden;
  }
  .player-surface { padding: 14px; }
  #shot-player {
    display: block;
    width: 100%;
    aspect-ratio: 16 / 9;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: #000;
  }
  .player-footer {
    display: flex;

  .player-actions {

    margin: 0;

    display: flex;

    gap: 6px;
    margin: 12px 0 0;
    padding-left: 18px;
    color: var(--warning);
    font-size: 12px;
  }
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    padding: 14px;
  }
  .toolbar label {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-height: 34px;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0 10px;
    background: var(--secondary);
    color: var(--secondary-foreground);
    font-size: 12px;
  }
  .toolbar button {
    padding: 0 12px;
    font-size: 12px;
  }
  #confirm-document,
  #save-corrections {
    background: var(--primary);
    color: var(--primary-foreground);
    border-color: var(--primary);
  }
  #confirm-document:hover:not(:disabled),
  #save-corrections:hover:not(:disabled) {
    background: var(--primary);
    color: var(--primary-foreground);
    filter: brightness(1.12);
  }
  #pending-indicator {
    min-height: 18px;
    color: var(--warning);
    font-size: 12px;
  }
  .summary-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    padding: 18px;
  }
  .metric-card {
    min-width: 0;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--secondary);
    padding: 12px;
  }
  .metric-card-motion {
    border-color: var(--warning-border);
    background:
      linear-gradient(135deg, rgba(197, 138, 25, 0.14), rgba(255, 253, 248, 0.88));
  }
  .metric-card-motion .metric-value { color: var(--warning); }
  .metric-label {
    margin: 0;
    color: var(--muted-foreground);
    font-size: 11px;
  }
  .metric-value {
    margin: 6px 0 0;
    font-size: 24px;
    font-weight: 720;
    letter-spacing: -0.03em;
  }
  .timeline-card { overflow: hidden; }
  .timeline-track {
    display: flex;
    min-height: 64px;
    gap: 2px;
    padding: 0;
  }
  .timeline-shot {
    flex: 0 0 max(var(--shot-width), 1.6%);
    min-width: 18px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--secondary);
    color: var(--secondary-foreground);
    padding: 8px 4px;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    font-size: 10px;
  }
  .timeline-shot.is-review { border-color: var(--warning-border); color: var(--warning); }

    border-color: var(--warning-border);

  .timeline-shot.is-music { background: var(--success-bg); }
  .timeline-shot.is-unknown { border-style: dashed; color: var(--muted-foreground); }
  .timeline-shot.is-selected,
  .filmstrip-shot.is-selected {
    outline: 2px solid var(--brand);
    outline-offset: 2px;
  }
  .filmstrip {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(118px, 1fr));
    gap: 10px;
    padding: 0 18px 18px;
  }
  .filmstrip-shot {
    display: flex;
    min-width: 0;
    flex-direction: column;
    gap: 8px;
    height: auto;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--secondary);
    color: var(--secondary-foreground);
    padding: 8px;
    text-align: left;
  }
  .filmstrip-shot img {
    width: 100%;

    border-radius: 8px;

  .filmstrip-shot span {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 11px;
  }
  .story-timeline-band,
  .motion-timeline-band,
  .shot-timeline-band {
    display: grid;
    grid-template-columns: 62px minmax(0, 1fr);
    gap: 10px;
    padding: 0 18px 12px;
  }
  .story-timeline-band { padding-top: 14px; }
  .timeline-lane-label {
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    gap: 3px;
    padding-top: 6px;
    color: var(--muted-foreground);
    font-size: 11px;
  }
  .timeline-lane-label span {
    color: var(--foreground);
    font-size: 12px;
    font-weight: 680;
  }
  .timeline-lane-label small {
    line-height: 1.35;
  }
  .motion-lane-legend { display: block; margin-top: 2px; }
  .story-segment-track {
    display: flex;
    min-height: 74px;
    gap: 3px;
  }
  .story-segment {
    display: flex;
    flex: 0 0 max(var(--story-width), 7%);

    min-height: 72px;
    flex-direction: column;
    align-items: flex-start;
    justify-content: space-between;
    gap: 6px;
    overflow: hidden;
    border-color: var(--success-border);
    background:
      linear-gradient(135deg, rgba(63, 155, 91, 0.14), rgba(255, 253, 248, 0.92));
    padding: 9px 10px;
    text-align: left;
  }
  .story-segment:hover:not(:disabled) {
    border-color: rgba(47, 125, 67, 0.55);
    background:
      linear-gradient(135deg, rgba(63, 155, 91, 0.20), rgba(255, 253, 248, 0.96));
  }
  .story-segment.is-selected {
    outline: 2px solid var(--brand);
    outline-offset: 2px;
  }
  .story-segment-topline,
  .story-segment-meta {
    display: flex;
    width: 100%;
    min-width: 0;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .story-segment strong {
    width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 13px;
  }
  .story-segment-meta {
    overflow: hidden;
    justify-content: flex-start;
    color: var(--muted-foreground);
    font-size: 11px;
    white-space: nowrap;
  }
  .story-time {
    color: var(--muted-foreground);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 10px;
  }
  .motion-event-track {
    --lane-height: 26px;
    position: relative;
    min-height: calc(var(--motion-lanes, 1) * var(--lane-height) + 12px);
    overflow: hidden;
    border: 1px solid var(--border);
    border-radius: 12px;
    background:
      repeating-linear-gradient(
        180deg,
        transparent 0,
        transparent calc(var(--lane-height) - 1px),
        rgba(229, 220, 203, 0.55) calc(var(--lane-height) - 1px),
        rgba(229, 220, 203, 0.55) var(--lane-height)
      ),
      linear-gradient(180deg, rgba(255, 253, 248, 0.72), rgba(241, 233, 216, 0.72));
  }
  .motion-event {
    position: absolute;
    left: var(--motion-left);
    top: calc(var(--motion-lane, 0) * var(--lane-height) + 3px);
    display: flex;
    align-items: center;
    gap: 6px;
    width: min(var(--motion-width), calc(100% - var(--motion-left)));
    height: 20px;
    min-height: 0;
    overflow: hidden;
    border-color: var(--warning-border);
    border-radius: 999px;
    background:
      linear-gradient(135deg, rgba(197, 138, 25, 0.24), rgba(255, 253, 248, 0.96));
    color: var(--warning);
    padding: 0 8px;
    text-align: left;
    box-shadow: 0 4px 10px rgba(146, 97, 10, 0.10);
  }
  .motion-event.is-point {
    width: 14px;
    min-width: 14px;
    height: 14px;
    margin-top: 3px;
    padding: 0;
    background: var(--warning);
    border-color: rgba(146, 97, 10, 0.58);
  }
  .motion-event.is-point strong,
  .motion-event.is-point span,
  .motion-event.is-compact strong,
  .motion-event.is-compact span {
    display: none;
  }
  .motion-event.is-range { min-width: 18px; }
  .motion-event.is-compact { padding: 0 4px; }
  .motion-event:hover:not(:disabled) {
    border-color: rgba(146, 97, 10, 0.58);
    background:
      linear-gradient(135deg, rgba(197, 138, 25, 0.30), rgba(255, 253, 248, 0.98));
  }
  .motion-event.is-point:hover:not(:disabled) { background: #7d5208; }
  .motion-event.is-selected {
    outline: 2px solid var(--brand);

  }
  .motion-event strong {
    flex: 0 0 auto;

  }
  .motion-event span {
    flex: 1 1 auto;

    text-overflow: ellipsis;

    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 10px;
  }

    font-size: 11px;
  }
  .table-card { overflow: hidden; }

    display: flex;

  .matrix-summary-text {
    display: flex;
    min-width: 0;
    flex-direction: column;
    gap: 6px;
  }
  .field-category-nav {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 16px 18px;
    border-top: 1px solid var(--border);
  }
  .category-tab {

    padding: 0 11px;

  }

    color: var(--primary-foreground);
  }
  .table-wrap {
    overflow: auto;

  }
  .shot-table {

  }
  .shot-table thead th {

    width: 150px;

    font-size: 11px;
    white-space: normal;
  }
  .field-group-tbody.is-filtered-out { display: none; }
  .field-group-tbody.is-collapsed tr:not(.field-group-row) { display: none; }

    left: 0;
    z-index: 1;
    padding: 0;
    background: var(--card);
  }
  .field-group-toggle {

    padding: 12px 14px;
    color: var(--foreground);

  }
  .field-group-toggle:hover {
    background: var(--secondary);
  }
  .field-group-toggle span:first-child {

    min-width: 0;

    gap: 4px;

  }
  .field-group-toggle small {

    font-size: 11px;

    font-size: 12px;
    font-weight: 650;
  }
  .field-key {

  }
  .shot-head {
    display: flex;
    flex-direction: column;
    gap: 8px;

    max-width: 220px;
  }
  .shot-id {

    font-weight: 750;

  }

  .duration {

    font-size: 11px;
  }

    max-width: 190px;

    border-radius: 10px;

    display: inline-flex;

  .cell-verified,

    font-size: 11px;

<div class="app-shell">
  <main class="main-shell">

          <label for="loop-shot"><input type="checkbox" id="loop-shot"> 循环播放该镜头</label>
          <button type="button" id="export-corrections">导出校对记录</button>
          <button type="button" id="save-corrections" hidden>保存到本地</button>

<script>
(function () {
  "use strict";
  window.__REVIEW_SERVER__ = __SERVER_MODE__;
  var DOCUMENT_TYPE = "shotAnalysis";
  var SOURCE_REVISION_ID = __SOURCE_REVISION_JS__;
  var REVIEW_REASONS = __REVIEW_REASONS_JSON__;
  var FULL_VIDEO_SRC = __FULL_VIDEO_SRC_JS__;
  var SHOT_INSPECTOR = __SHOT_INSPECTOR_JSON__;

  var player = document.getElementById("shot-player");
  var loopToggle = document.getElementById("loop-shot");
  var currentStartMs = 0;
  var currentEndMs = null;
  var drawer = document.getElementById("evidence-drawer-content");
  var shotsById = {};
  (SHOT_INSPECTOR.shots || []).forEach(function (shot) {
    shotsById[shot.shotID] = shot;
  });
  var inspectorFilterMode = "all";

  function appendText(parent, tag, className, text) {
    var el = document.createElement(tag);
    if (className) { el.className = className; }
    el.textContent = text;
    parent.appendChild(el);
    return el;
  }

  function appendBadge(parent, text, className) {
    return appendText(parent, "span", "badge " + (className || "badge-outline"), text);
  }

  function stateBadgeClass(state) {
    if (state === "absent") { return "badge-success"; }
    if (state === "absent-claimed") { return "badge-warning"; }
    if (state === "unmapped") { return "badge-destructive"; }
    return "badge-outline";
  }

  function stateLabel(state) {
    if (state === "value") { return "已识别"; }
    if (state === "absent") { return "确认没有"; }
    if (state === "absent-claimed") { return "模型未发现"; }
    if (state === "unknown") { return "待确认"; }
    if (state === "unmapped") { return "待归类"; }
    return "待确认";
  }

  function confidenceLabel(confidence) {
    if (confidence === "high") { return "可信度高"; }
    if (confidence === "medium") { return "可信度中"; }
    if (confidence === "low") { return "可信度低"; }
    return "可信度待确认";
  }

  function sourceLabel(source) {
    if (source === "human") { return "人工校对"; }
    if (source === "unifiedModel" || source === "textModel") { return "视频理解"; }
    if (source === "asr") { return "语音识别"; }
    if (source === "audioDetector") { return "声音检测"; }
    if (source === "appleVision") { return "画面运动检测"; }
    if (source === "ffmpeg" || source === "ffprobe") { return "媒体检测"; }
    if (source === "aggregate") { return "汇总计算"; }
    if (source === "fallback") { return "暂未分析"; }
    return "系统分析";
  }

  function appendMeta(container, label, value) {
    var item = document.createElement("div");
    appendText(item, "dt", "", label);
    appendText(item, "dd", "", value || "待确认");
    container.appendChild(item);
  }

  function allFields(shot) {
    var fields = [];
    (SHOT_INSPECTOR.groups || []).forEach(function (group) {
      fields = fields.concat((shot.groups && shot.groups[group.id]) || []);
    });
    return fields;
  }

  function fieldByKey(shot, key) {
    var fields = allFields(shot);
    for (var i = 0; i < fields.length; i++) {
      if (fields[i].field === key) { return fields[i]; }
    }
    return null;
  }

  function fieldText(shot, key) {
    var field = fieldByKey(shot, key);
    return field ? String(field.value || "未知") : "未知";
  }

  function compactText(text, maxLength) {
    var value = String(text || "未知").replace(/\s+/g, " ").trim();
    if (value.length <= maxLength) { return value; }
    return value.slice(0, Math.max(0, maxLength - 1)) + "…";
  }

  function joinValues(shot, keys, fallback) {
    var values = [];
    keys.forEach(function (key) {
      var text = fieldText(shot, key);
      if (text && values.indexOf(text) === -1) { values.push(text); }
    });
    return values.length ? compactText(values.join(" / "), 86) : fallback;
  }

  function countFields(shot, predicate) {
    return allFields(shot).filter(predicate).length;
  }

  function isRiskField(field) {
    var value = String(field.value || "");
    return field.state === "unknown" ||
      field.state === "absent-claimed" ||
      field.state === "unmapped" ||
      field.confidence === "low" ||
      field.confidence === "unknown" ||
      (field.field === "quality.flags" && value !== "" && value !== "无标记");
  }

  function appendQuickRow(container, label, value, risk) {
    var row = document.createElement("div");
    row.className = "quick-row" + (risk ? " is-risk" : "");
    appendText(row, "dt", "", label);
    appendText(row, "dd", "", value);
    container.appendChild(row);
  }

  function appendQuickRead(parent, shot) {
    var card = document.createElement("section");
    card.className = "inspector-card inspector-quick-read";
    appendText(card, "h3", "", "快速判断");
    var grid = document.createElement("dl");
    grid.className = "quick-grid";
    appendQuickRow(
      grid,
      "画面",
      joinValues(shot, ["visual.subjects", "visual.actions", "visual.setting"], "未知"),
      false
    );
    appendQuickRow(
      grid,
      "声音",
      joinValues(shot, ["audio.speech", "audio.bgmPresence", "audio.soundEvents"], "未知"),
      fieldByKey(shot, "audio.speech") && fieldByKey(shot, "audio.speech").state === "unknown"
    );
    appendQuickRow(
      grid,
      "剪辑",
      joinValues(shot, ["editing.transition", "visual.cameraMovement", "visual.movementIntensity"], "未知"),
      false
    );
    appendQuickRow(
      grid,
      "风格",
      joinValues(shot, ["visual.framing", "visual.brightness", "visual.perceivedColorTemperature"], "未知"),
      false
    );
    var unknownCount = countFields(shot, function (field) { return field.state === "unknown"; });
    var claimedAbsentCount = countFields(shot, function (field) { return field.state === "absent-claimed"; });
    var riskCount = countFields(shot, isRiskField);
    var riskText = shot.reviewReasons.length ?
      (shot.reviewReasons.length + " 项复核理由") :
      (riskCount ? (riskCount + " 个字段需留意") : "无明显风险");
    if (unknownCount || claimedAbsentCount) {
      riskText += " · 待确认 " + unknownCount + " / 模型未发现 " + claimedAbsentCount;
    }
    appendQuickRow(grid, "风险", riskText, riskCount > 0 || shot.reviewReasons.length > 0);
    card.appendChild(grid);
    parent.appendChild(card);
  }

  function appendSummaryCard(parent, shot) {

  function motionStatusLabel(status) {
    if (status === "complete") { return "已检测"; }
    if (status === "skipped") { return "未运行"; }
    if (status === "failed") { return "检测失败"; }
    return "待确认";
  }

  function appendMotionCandidate(container, item, isRange) {
    var row = document.createElement("article");
    row.className = "motion-candidate";
    var title = document.createElement("div");
    title.className = "motion-candidate-title";
    var label = (isRange ? item.type : item.property) || "候选";
    var timeText = isRange ?
      (String(item.startMs) + "–" + String(item.endMs) + " ms") :
      (String(item.timeMs) + " ms");
    appendText(title, "strong", "", label + " · " + timeText);
    appendBadge(title, item.confidence || "可信度待确认", "badge-warning");
    row.appendChild(title);
    appendText(row, "p", "motion-candidate-body", item.summary || item.replicationHint || "需要人工视觉确认");
    var meta = document.createElement("div");
    meta.className = "motion-candidate-meta";
    appendBadge(meta, isRange ? "区间" : "关键帧", "badge-outline");
    if (item.needsVisualConfirmation) {
      appendBadge(meta, "需要人工视觉确认", "badge-warning");
    }
    row.appendChild(meta);
    if (item.replicationHint && item.replicationHint !== item.summary) {
      appendText(row, "p", "motion-candidate-body", item.replicationHint);
    }
    var refs = item.evidenceRefs || [];
    if (refs.length) {
      var evidence = document.createElement("details");
      evidence.className = "motion-evidence";
      appendText(evidence, "summary", "", "追溯依据");
      refs.forEach(function (ref) {
        appendText(evidence, "code", "", ref);
      });
      row.appendChild(evidence);
    }
    container.appendChild(row);
  }

  function appendMotionEffects(parent, shot) {
    var motion = shot.motionEffects;
    if (!motion) { return; }
    var summary = motion.summary || {};
    var speedRamps = motion.speedRamps || [];
    var keyframes = motion.keyframes || [];
    var total = (parseInt(summary.candidateCount, 10) || 0) + speedRamps.length;
    var card = document.createElement("section");
    card.className = "inspector-card inspector-motion-card";
    var title = document.createElement("div");
    title.className = "inspector-section-title";
    appendText(title, "h3", "", "运动复刻候选");
    appendBadge(title, motionStatusLabel(motion.status), total ? "badge-warning" : "badge-outline");
    card.appendChild(title);
    var meta = document.createElement("dl");
    meta.className = "motion-summary-grid";
    appendMeta(meta, "候选数量", total ? String(total) : "暂无候选");
    appendMeta(meta, "候选类型", (summary.properties || []).join(" / ") || "待确认");
    appendMeta(meta, "复核状态", total ? "需要确认" : "无候选");
    card.appendChild(meta);
    if (keyframes.length || speedRamps.length) {
      var list = document.createElement("div");
      list.className = "motion-candidate-list";
      keyframes.forEach(function (item) { appendMotionCandidate(list, item, false); });
      speedRamps.forEach(function (item) { appendMotionCandidate(list, item, true); });
      card.appendChild(list);
    } else {
      appendText(
        card,
        "p",
        "inspector-shot-summary",
        motion.status === "skipped" ? "运动复刻检测未运行；这不代表没有动效。" : "暂无待展示候选。"
      );
    }
    parent.appendChild(card);
  }

  function appendInspectorField(container, field) {
    var item = document.createElement("details");
    item.className = "inspector-field-row state-row-" + field.state;
    if (field.source === "human") { item.classList.add("state-row-human"); }
    item.setAttribute("data-field", field.field);
    item.setAttribute("data-value-state", field.state);
    item.setAttribute("data-confidence", field.confidence);
    item.setAttribute("data-source", field.source);
    item.setAttribute("data-verified", field.verified ? "true" : "false");
    item.setAttribute("data-evidence-refs", (field.evidenceRefs || []).join(" "));
    item.setAttribute("data-is-risk", isRiskField(field) ? "true" : "false");
    var summary = document.createElement("summary");
    summary.className = "inspector-field-summary";
    appendText(summary, "span", "state-dot", "");
    appendText(summary, "span", "inspector-field-label", field.label);
    appendText(summary, "span", "inspector-field-value", compactText(field.value, 72));
    appendText(summary, "span", "inspector-field-count", (field.evidenceRefs || []).length + " 条依据");
    item.appendChild(summary);
    var body = document.createElement("div");
    body.className = "inspector-field-body";
    var trace = document.createElement("details");

    var meta = document.createElement("div");
    meta.className = "inspector-field-meta";
    appendBadge(meta, stateLabel(field.state), stateBadgeClass(field.state));
    appendBadge(meta, confidenceLabel(field.confidence), "badge-outline");
    appendBadge(meta, sourceLabel(field.source), "badge-outline");
    if (field.verified) { appendBadge(meta, "已核实", "badge-success"); }
    trace.appendChild(meta);
    if (field.evidenceRefs && field.evidenceRefs.length) {
      var evidence = document.createElement("div");
      evidence.className = "inspector-evidence";
      appendText(evidence, "span", "inspector-evidence-label", "原始依据");
      field.evidenceRefs.forEach(function (ref) {
        appendText(evidence, "code", "", ref);

      trace.appendChild(evidence);
    }
    body.appendChild(trace);
    item.appendChild(body);
    container.appendChild(item);

  function bindInspectorBoundary(form, shot) {
    form.addEventListener("submit", function (event) {
      event.preventDefault();
      var startMs = parseInt(form.elements.finalStartMs.value, 10);
      var endMs = parseInt(form.elements.finalEndMs.value, 10);
      if (!(endMs > startMs)) {
        indicator.textContent = shot.shotID + "：结束时间必须晚于开始时间";
        return;
      }
      var original = null;
      var index = -1;
      for (var i = 0; i < shotOrder.length; i++) {
        if (shotOrder[i].shotId === shot.shotID) { original = shotOrder[i]; index = i; break; }
      }
      var notes = [];
      if (original) {
        if (index > 0 && shotOrder[index - 1].endMs !== startMs) {
          notes.push("与上一镜头不连续");
        }
        if (index < shotOrder.length - 1 && shotOrder[index + 1].startMs !== endMs) {
          notes.push("与下一镜头不连续");
        }
      }
      recordChange({
        kind: "boundary",
        entityID: shot.shotID,
        field: "finalRange",
        oldValue: original ? { finalStartMs: original.startMs, finalEndMs: original.endMs } : null,
        newValue: { finalStartMs: startMs, finalEndMs: endMs },
        state: "value",
        verified: true
      });
      if (notes.length) {
        indicator.textContent = shot.shotID + " 提示：" + notes.join("；") + "（已记录，最终以应用端校验为准）";
      }
    });
  }

  function appendBoundaryPanel(parent, shot) {
    var details = document.createElement("details");
    details.className = "inspector-boundary";
    details.setAttribute("data-shot-id", shot.shotID);
    var summary = document.createElement("summary");
    var title = document.createElement("span");
    title.className = "inspector-group-title";
    appendText(title, "strong", "", "时间范围");
    appendText(title, "small", "", shot.timecode + " · " + shot.durationText);
    summary.appendChild(title);
    appendBadge(summary, "调整", "badge-outline");
    details.appendChild(summary);

    var form = document.createElement("form");
    form.className = "inspector-boundary-form";
    form.setAttribute("aria-label", shot.shotID + " 时间范围调整");
    var startLabel = appendText(form, "label", "", "开始时间（毫秒）");
    var startInput = document.createElement("input");
    startInput.type = "number";
    startInput.name = "finalStartMs";
    startInput.min = "0";
    startInput.value = String(shot.startMs || 0);

    parent.appendChild(details);

  function appendReviewReasons(parent, shot) {
    if (!shot.reviewReasons || !shot.reviewReasons.length) { return; }
    var card = document.createElement("section");
    card.className = "inspector-card";
    appendText(card, "h3", "", "复核理由");
    var reasonList = document.createElement("ul");
    reasonList.className = "review-reasons";

  function fieldMatchesFilter(row, mode) {
    if (mode === "risk") { return row.getAttribute("data-is-risk") === "true"; }
    if (mode === "unknown") { return row.getAttribute("data-value-state") === "unknown"; }
    if (mode === "human") { return row.getAttribute("data-source") === "human"; }
    return true;
  }

  function applyInspectorFilter() {
    var visibleRows = 0;
    Array.prototype.forEach.call(drawer.querySelectorAll(".inspector-field-row"), function (row) {
      var visible = fieldMatchesFilter(row, inspectorFilterMode);
      row.hidden = !visible;
      if (visible) { visibleRows += 1; }
    });
    Array.prototype.forEach.call(drawer.querySelectorAll(".inspector-group"), function (group) {
      var hasVisibleRow = !!group.querySelector(".inspector-field-row:not([hidden])");
      group.hidden = !hasVisibleRow;
    });
    var empty = drawer.querySelector(".inspector-empty");
    if (empty) { empty.hidden = visibleRows !== 0; }
    Array.prototype.forEach.call(drawer.querySelectorAll("[data-inspector-filter]"), function (button) {
      var active = button.getAttribute("data-inspector-filter") === inspectorFilterMode;
      button.classList.toggle("is-active", active);
      button.setAttribute("aria-pressed", active ? "true" : "false");
    });
  }

  function appendInspectorFilterbar(parent) {
    var filters = [
      ["all", "全部"],
      ["risk", "只看异常"],
      ["unknown", "待确认"],
      ["human", "人工修正"]
    ];
    var bar = document.createElement("div");
    bar.className = "inspector-filterbar";
    bar.setAttribute("aria-label", "镜头详情字段筛选");
    filters.forEach(function (filterSpec) {
      var button = document.createElement("button");
      button.type = "button";
      button.textContent = filterSpec[1];
      button.setAttribute("data-inspector-filter", filterSpec[0]);
      button.setAttribute("aria-pressed", filterSpec[0] === inspectorFilterMode ? "true" : "false");
      button.addEventListener("click", function () {
        inspectorFilterMode = filterSpec[0];
        applyInspectorFilter();
      });
      bar.appendChild(button);
    });
    parent.appendChild(bar);
  }

  function renderShotInspector(shotId) {
    var shot = shotsById[shotId] || (SHOT_INSPECTOR.shots || [])[0];
    drawer.textContent = "";
    if (!shot) {
      appendText(drawer, "p", "", "暂无可显示的镜头详情。");
      return;
    }
    var hero = document.createElement("section");
    hero.className = "inspector-hero";
    if (shot.frameRef) {
      var img = document.createElement("img");
      img.className = "inspector-cover";
      img.src = shot.frameRef;
      img.alt = shot.shotID + " 代表帧";
      hero.appendChild(img);
    }
    var heroBody = document.createElement("div");
    heroBody.className = "inspector-hero-body";
    var titleRow = document.createElement("div");
    titleRow.className = "inspector-title-row";
    appendText(titleRow, "h3", "inspector-shot-id", shot.shotID);
    appendBadge(titleRow, shot.needsReview ? "需复核" : "正常", shot.needsReview ? "badge-warning" : "badge-success");
    heroBody.appendChild(titleRow);
    var timeRow = document.createElement("div");
    timeRow.className = "inspector-time-row";
    appendText(timeRow, "span", "inspector-timecode", shot.timecode || "待确认");
    appendText(timeRow, "span", "", shot.durationText || "待确认");
    heroBody.appendChild(timeRow);
    var actions = document.createElement("div");
    actions.className = "inspector-actions";
    var playButton = document.createElement("button");
    playButton.type = "button";
    playButton.textContent = shot.clipSrc ? "播放该镜头" : "暂无片段";
    playButton.disabled = !shot.clipSrc;
    playButton.addEventListener("click", function () {
      if (!shot.clipSrc) { return; }
      playShot(shot.clipSrc, shot.startMs || 0, shot.endMs || null, shot.shotID);
    });
    actions.appendChild(playButton);
    appendBadge(actions, "校对时间", "badge-outline");
    heroBody.appendChild(actions);
    hero.appendChild(heroBody);
    drawer.appendChild(hero);

    var meta = document.createElement("dl");
    meta.className = "inspector-meta";
    appendMeta(meta, "起点", String(shot.startMs) + " ms");
    appendMeta(meta, "终点", String(shot.endMs) + " ms");
    appendMeta(meta, "可查看信息", String(allFields(shot).length) + " 项");
    appendMeta(meta, "有依据", String(countFields(shot, function (field) { return !!(field.evidenceRefs && field.evidenceRefs.length); })) + " 项");
    drawer.appendChild(meta);

    appendSummaryCard(drawer, shot);
    appendStoryContext(drawer, shot);
    appendMotionEffects(drawer, shot);
    appendQuickRead(drawer, shot);
    appendReviewReasons(drawer, shot);

    var detailsCard = document.createElement("section");
    detailsCard.className = "inspector-card inspector-fields-card";
    var sectionTitle = document.createElement("div");
    sectionTitle.className = "inspector-section-title";
    appendText(sectionTitle, "h3", "", "详细信息");
    appendBadge(sectionTitle, allFields(shot).length + " 项", "badge-outline");
    detailsCard.appendChild(sectionTitle);
    appendInspectorFilterbar(detailsCard);

    (SHOT_INSPECTOR.groups || []).forEach(function (group, index) {
      var fields = (shot.groups && shot.groups[group.id]) || [];
      if (!fields.length) { return; }
      var details = document.createElement("details");
      details.className = "inspector-group";
      if (index === 0) { details.open = true; }
      var summary = document.createElement("summary");
      var groupTitle = document.createElement("span");
      groupTitle.className = "inspector-group-title";
      appendText(groupTitle, "strong", "", group.title);
      appendText(groupTitle, "small", "", group.description);
      summary.appendChild(groupTitle);
      appendBadge(summary, fields.length + " 项", "badge-outline");
      details.appendChild(summary);
      var fieldList = document.createElement("div");
      fieldList.className = "inspector-fields";
      fields.forEach(function (field) {
        appendInspectorField(fieldList, field);
      });
      details.appendChild(fieldList);
      detailsCard.appendChild(details);
    });
    var empty = appendText(detailsCard, "p", "inspector-empty", "当前筛选下没有内容。");
    empty.hidden = true;
    drawer.appendChild(detailsCard);
    appendBoundaryPanel(drawer, shot);
    applyInspectorFilter();
  }

  function highlightShot(shotId) {
    Array.prototype.forEach.call(document.querySelectorAll(".is-selected"), function (el) {
      el.classList.remove("is-selected");
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-shot-id]"), function (el) {
      var storyShotIds = (" " + (el.getAttribute("data-layer-shot-ids") || "") + " ");
      var isSameShot = el.getAttribute("data-shot-id") === shotId;
      var isSameStory = storyShotIds.indexOf(" " + shotId + " ") !== -1;
      if ((isSameShot || isSameStory) &&
          (el.classList.contains("timeline-shot") ||
           el.classList.contains("filmstrip-shot") ||
           el.classList.contains("story-segment") ||
           el.classList.contains("motion-event"))) {
        el.classList.add("is-selected");
      }
    });
  }

  function playShot(src, startMs, endMs, shotId) {
    currentStartMs = startMs;
    currentEndMs = endMs;
    if (shotId) {
      highlightShot(shotId);
      renderShotInspector(shotId);
    }
    if (player.getAttribute("src") !== src) { player.setAttribute("src", src); }
    player.currentTime = startMs / 1000;
    player.play();
  }
  player.addEventListener("timeupdate", function () {
    if (currentEndMs === null) { return; }
    if (player.currentTime * 1000 >= currentEndMs) {
      if (loopToggle.checked) {
        player.currentTime = currentStartMs / 1000;
      } else {
        player.pause();
        currentEndMs = null;
      }
    }
  });
  var fullVideoButton = document.getElementById("play-full-video");
  if (!FULL_VIDEO_SRC) {
    fullVideoButton.disabled = true;
    fullVideoButton.textContent = "完整视频不可用";
  }
  fullVideoButton.addEventListener("click", function () {
    if (!FULL_VIDEO_SRC) { return; }
    currentStartMs = 0;
    currentEndMs = null;
    Array.prototype.forEach.call(document.querySelectorAll(".is-selected"), function (el) {
      el.classList.remove("is-selected");
    });
    if (player.getAttribute("src") !== FULL_VIDEO_SRC) {
      player.setAttribute("src", FULL_VIDEO_SRC);
    }
    player.currentTime = 0;
    player.play();
  });

  function bindShotJump(selector) {
    Array.prototype.forEach.call(document.querySelectorAll(selector), function (btn) {
      btn.addEventListener("click", function () {
        var src = btn.getAttribute("data-clip-src");
        var shotId = btn.getAttribute("data-shot-id");
        if (shotId) {
          highlightShot(shotId);
          renderShotInspector(shotId);
        }
        if (!src) { return; }
        playShot(src, parseInt(btn.getAttribute("data-start-ms"), 10) || 0,
                 parseInt(btn.getAttribute("data-end-ms"), 10), shotId);
      });
    });
  }
  bindShotJump(".shot-jump");

  var filter = document.getElementById("filter-needs-review");
  filter.addEventListener("change", function () {
    var hide = {};
    Array.prototype.forEach.call(document.querySelectorAll("th[data-needs-review]"), function (th) {
      hide[th.getAttribute("data-shot-id")] = filter.checked && th.getAttribute("data-needs-review") !== "true";
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-shot-id]"), function (el) {
      var sid = el.getAttribute("data-shot-id");
      var storyShotIds = (el.getAttribute("data-layer-shot-ids") || "").split(/\s+/).filter(Boolean);
      if (storyShotIds.length) {
        var hideStory = storyShotIds.every(function (storySid) { return hide[storySid] === true; });
        el.classList.toggle("shot-hidden", hideStory);
      } else if (Object.prototype.hasOwnProperty.call(hide, sid)) {
        el.classList.toggle("shot-hidden", hide[sid]);
      }
    });
  });

  function setFieldFilter(groupId) {
    Array.prototype.forEach.call(document.querySelectorAll(".category-tab"), function (button) {
      var active = button.getAttribute("data-field-filter") === groupId;
      button.classList.toggle("is-active", active);
      button.setAttribute("aria-selected", active ? "true" : "false");
    });
    Array.prototype.forEach.call(document.querySelectorAll(".field-group-tbody"), function (tbody) {
      var matches = groupId === "all" || tbody.getAttribute("data-field-group") === groupId;
      tbody.classList.toggle("is-filtered-out", !matches);
      if (groupId !== "all" && matches) {
        tbody.classList.remove("is-collapsed");
        var toggle = tbody.querySelector(".field-group-toggle");
        if (toggle) { toggle.setAttribute("aria-expanded", "true"); }
      }
    });
  }
  Array.prototype.forEach.call(document.querySelectorAll(".category-tab"), function (button) {
    button.addEventListener("click", function () {
      setFieldFilter(button.getAttribute("data-field-filter") || "all");
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll(".field-group-toggle"), function (button) {
    button.addEventListener("click", function () {
      var groupId = button.getAttribute("data-field-group-target");
      var tbody = null;
      Array.prototype.some.call(document.querySelectorAll(".field-group-tbody"), function (candidate) {
        if (candidate.getAttribute("data-field-group") === groupId) {
          tbody = candidate;
          return true;
        }
        return false;
      });
      if (!tbody) { return; }
      var expanded = !tbody.classList.toggle("is-collapsed");
      button.setAttribute("aria-expanded", expanded ? "true" : "false");
    });
  });

  var pendingChanges = [];
  var indicator = document.getElementById("pending-indicator");
  function sameKey(a, b) {
    return a.entityID === b.entityID && a.field === b.field &&
      (a.kind || "field") === (b.kind || "field");
  }
  function recordChange(change) {
    change.changedAt = new Date().toISOString();
    change.actor = "human";
    for (var i = pendingChanges.length - 1; i >= 0; i--) {
      if (sameKey(pendingChanges[i], change)) { pendingChanges.splice(i, 1); }
    }
    pendingChanges.push(change);
    indicator.textContent = "有 " + pendingChanges.length + " 项未导出修改";
  }
  window.addEventListener("beforeunload", function (event) {
    if (pendingChanges.length > 0) {
      event.preventDefault();
      event.returnValue = "";
    }
  });

  function cellOf(el) { return el.closest("td[data-field]"); }
  function currentVerified(td) {
    var box = td.querySelector(".verify-toggle");
    return box ? box.checked : false;
  }
  Array.prototype.forEach.call(document.querySelectorAll(".cell-edit"), function (control) {
    control.addEventListener("change", function () {
      var td = cellOf(control);
      if (!td) { return; }
      var state, newValue;
      if (control.tagName === "SELECT") {
        if (control.value === "") { return; }
        if (control.value === "unknown") { state = "unknown"; newValue = null; }
        else { state = "value"; newValue = control.value; }
      } else {
        var text = control.value.trim();
        if (text === "") { state = "unknown"; newValue = null; }
        else { state = "value"; newValue = text; }
      }
      recordChange({
        entityID: control.getAttribute("data-shot-id"),
        field: control.getAttribute("data-field"),
        oldValue: control.getAttribute("data-initial-value") || null,
        newValue: newValue,
        state: state,
        verified: currentVerified(td)
      });
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll(".verify-toggle"), function (box) {
    box.addEventListener("change", function () {
      var td = cellOf(box);
      if (!td) { return; }
      var control = td.querySelector(".cell-edit");
      var newValue = null;
      if (control && control.tagName !== "SELECT" && control.value.trim() !== "") {
        newValue = control.value.trim();
      } else if (control && control.tagName === "SELECT" &&
                 control.value !== "" && control.value !== "unknown") {
        newValue = control.value;
      }
      recordChange({
        entityID: box.getAttribute("data-shot-id"),
        field: box.getAttribute("data-field"),
        oldValue: control ? (control.getAttribute("data-initial-value") || null) : null,
        newValue: newValue,
        state: td.getAttribute("data-value-state"),
        verified: box.checked
      });
    });
  });

  function correctionsPayload() {
    return {
      correctionVersion: 1,
      documentType: DOCUMENT_TYPE,
      sourceRevisionID: SOURCE_REVISION_ID,
      changes: pendingChanges
    };
  }
  document.getElementById("export-corrections").addEventListener("click", function () {
    var blob = new Blob([JSON.stringify(correctionsPayload(), null, 2)],
                        { type: "application/json" });
    var link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "corrections-" + DOCUMENT_TYPE + ".json";
    link.click();
    URL.revokeObjectURL(link.href);
  });
  var saveButton = document.getElementById("save-corrections");
  if (window.__REVIEW_SERVER__) { saveButton.hidden = false; }
  saveButton.addEventListener("click", function () {
    fetch("/api/corrections", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(correctionsPayload())
    }).then(function (resp) {
      if (resp.ok) {
        pendingChanges = [];
        indicator.textContent = "已保存到本地";
      } else {
        indicator.textContent = "保存失败：HTTP " + resp.status;
      }
    }).catch(function (err) {
      indicator.textContent = "保存失败：" + err;
    });
  });
  document.getElementById("confirm-document").addEventListener("click", function () {
    if (!window.__REVIEW_SERVER__) {
      indicator.textContent = "当前是离线页面：请先导出校对记录，再在应用中导入确认。";
      return;
    }
    fetch("/api/confirm", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ documentType: DOCUMENT_TYPE, sourceRevisionID: SOURCE_REVISION_ID })
    }).then(function (resp) {
      indicator.textContent = resp.ok ? "文档已确认" : "确认失败：HTTP " + resp.status;
    }).catch(function (err) {
      indicator.textContent = "确认失败：" + err;
    });
  });

  var shotOrder = [];
  Array.prototype.forEach.call(document.querySelectorAll("th[data-shot-id][data-start-ms]"), function (th) {
    shotOrder.push({
      shotId: th.getAttribute("data-shot-id"),
      startMs: parseInt(th.getAttribute("data-start-ms"), 10),
      endMs: parseInt(th.getAttribute("data-end-ms"), 10)
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll("td[data-field]"), function (td) {
    td.addEventListener("click", function (event) {
      if (event.target.closest("select, input, button, textarea, label, a")) { return; }
      var shotId = td.getAttribute("data-shot-id");
      if (!shotId) { return; }
      highlightShot(shotId);
      renderShotInspector(shotId);
    });
  });
  var firstShot = (SHOT_INSPECTOR.shots || [])[0];
  if (firstShot) {
    highlightShot(firstShot.shotID);
    renderShotInspector(firstShot.shotID);
  }
})();
</script>
</body>
</html>
