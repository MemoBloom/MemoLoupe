<!DOCTYPE html>
<html lang="zh-CN" data-document-type="storyAnalysis" data-document-status="__DOCUMENT_STATUS__" data-contract-version="__CONTRACT_VERSION__" data-source-revision="__SOURCE_REVISION__">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; media-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>MemoLoupe 故事拉片校对台</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f7f4ef;
    --card: rgba(255,255,255,0.92);
    --ink: #181713;
    --muted: #6f6a5f;
    --line: rgba(45, 39, 27, 0.13);
    --accent: #c27a2c;
    --accent-ink: #6d3e09;
    --blue: #2563eb;
    --green: #16794c;
    --shadow: 0 18px 48px rgba(52, 39, 18, 0.10);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    color: var(--ink);
    background:
      radial-gradient(circle at top left, rgba(255, 208, 138, 0.28), transparent 34rem),
      linear-gradient(180deg, #fffaf2 0%, var(--bg) 42%, #f5f1eb 100%);
  }
  a { color: inherit; }
  .skip-link { position: absolute; left: 16px; top: -48px; z-index: 20; background: #111827; color: #fff; padding: 10px 14px; border-radius: 999px; text-decoration: none; }
  .skip-link:focus { top: 16px; }
  header.metadata {
    padding: 28px clamp(18px, 4vw, 48px) 18px;
    border-bottom: 1px solid var(--line);
  }
  header.metadata h1 { font-size: clamp(28px, 5vw, 52px); line-height: 1.04; letter-spacing: -0.05em; margin: 4px 0 18px; }
  .eyebrow { margin: 0; color: var(--accent-ink); font-size: 12px; text-transform: uppercase; letter-spacing: 0.16em; font-weight: 750; }
  .metadata-grid { display: flex; flex-wrap: wrap; gap: 10px; margin: 0; }
  .metadata-grid div {
    display: grid;
    gap: 3px;
    min-width: 116px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: rgba(255,255,255,0.62);
  }
  .metadata-grid dt { color: var(--muted); font-size: 12px; }
  .metadata-grid dd { margin: 0; font-weight: 760; }
  .toolbar {
    position: sticky;
    top: 0;
    z-index: 10;
    padding: 10px clamp(18px, 4vw, 48px);
    background: rgba(255, 250, 242, 0.86);
    border-bottom: 1px solid var(--line);
    backdrop-filter: blur(16px);
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
  }
  button, .link-button {
    font: inherit;
    font-weight: 700;
    padding: 8px 12px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: #fff;
    color: var(--ink);
    cursor: pointer;
    text-decoration: none;
    box-shadow: 0 4px 14px rgba(32, 24, 12, 0.05);
  }
  button:hover, .link-button:hover { border-color: rgba(194, 122, 44, 0.55); }
  button:disabled { color: #9a948a; cursor: not-allowed; background: #f4f0ea; }
  button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid rgba(37,99,235,.32); outline-offset: 2px; }
  #pending-indicator { color: var(--accent-ink); font-size: 13px; }
  .player-shell {
    display: grid;
    grid-template-columns: minmax(280px, 560px) 1fr;
    gap: 18px;
    align-items: center;
    padding: 16px clamp(18px, 4vw, 48px) 0;
  }
  #story-player { width: 100%; background: #000; display: block; border-radius: 22px; box-shadow: var(--shadow); }
  .player-copy { color: var(--muted); line-height: 1.65; max-width: 520px; }
  .story-layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(260px, 340px);
    align-items: start;
    gap: 18px;
    padding: 18px clamp(18px, 4vw, 48px) 36px;
  }
  .main-col { min-width: 0; display: flex; flex-direction: column; gap: 18px; }
  .card, .story-block {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 24px;
    box-shadow: var(--shadow);
    padding: 18px;
  }
  .card-header, .block-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 14px;
  }
  .card-title, .timeline-card h2, .coverage-card summary, .slots-card h2 { font-size: 18px; margin: 0; letter-spacing: -0.02em; }
  .card-description, .validation-empty { color: var(--muted); margin: 6px 0 0; line-height: 1.6; }
  .summary-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    margin-top: 16px;
  }
  .metric-card { border: 1px solid var(--line); border-radius: 18px; padding: 14px; background: rgba(255,255,255,0.7); }
  .metric-label { color: var(--muted); margin: 0 0 6px; font-size: 12px; }
  .metric-value { margin: 0 0 10px; font-size: 26px; font-weight: 820; letter-spacing: -0.04em; }
  .hero-story-title { margin: 18px 0 0; font-size: clamp(22px, 3vw, 36px); line-height: 1.16; letter-spacing: -0.04em; font-weight: 830; }
  .badge, .status-badge, .boundary-badge, .slot-type {
    display: inline-flex;
    align-items: center;
    border-radius: 999px;
    padding: 4px 9px;
    font-size: 12px;
    line-height: 1;
    background: rgba(194, 122, 44, 0.12);
    color: var(--accent-ink);
    border: 1px solid rgba(194, 122, 44, 0.18);
    white-space: nowrap;
  }
  .badge-outline { background: rgba(255,255,255,0.7); color: var(--muted); }
  .badge-soft { background: #f4efe7; color: #5f584e; }
  .story-timeline { display: flex; gap: 6px; align-items: stretch; height: 72px; margin-top: 14px; }
  .story-timeline-segment {
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 96px;
    overflow: hidden;
    background: linear-gradient(135deg, #c27a2c, #8250df);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.25);
  }
  .story-timeline-segment a { color: #fff; text-decoration: none; font-weight: 800; padding: 10px; text-align: center; }
  .coverage-card { padding: 0; overflow: hidden; }
  .coverage-card summary { cursor: pointer; padding: 18px; }
  .coverage-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .coverage-table th, .coverage-table td { border-top: 1px solid var(--line); padding: 9px 12px; text-align: left; }
  .coverage-table thead th { color: var(--muted); background: rgba(255,255,255,0.55); }
  .story-block { scroll-margin-top: 76px; }
  .story-block:target { border-color: rgba(37,99,235,.55); box-shadow: 0 0 0 4px rgba(37,99,235,.12), var(--shadow); }
  .block-header h3 { font-size: clamp(22px, 3vw, 34px); line-height: 1.14; letter-spacing: -0.04em; margin: 3px 0 0; }
  .block-title { color: var(--ink); }
  .block-meta { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 13px; }
  .block-core { margin: 16px 0 0; max-width: 860px; font-size: 16px; line-height: 1.8; }
  .block-shots { color: var(--muted); margin: 8px 0 0; }
  .subsection-heading { display: flex; justify-content: space-between; gap: 12px; margin: 18px 0 12px; }
  .subsection-heading h4 { margin: 0; font-size: 15px; }
  .subsection-heading p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  .story-shot-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px;
  }
  .story-shot-card { overflow: hidden; border: 1px solid var(--line); border-radius: 20px; background: rgba(255,255,255,0.78); }
  .story-shot-thumb { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; background: #181713; color: #fff; }
  .story-shot-thumb.is-empty { display: grid; place-items: center; color: rgba(255,255,255,.7); font-size: 12px; }
  .story-shot-body { padding: 12px; }
  .story-shot-topline { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 12px; }
  .story-shot-topline strong { color: var(--ink); font-size: 13px; }
  .story-shot-summary { margin: 8px 0 10px; line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .shot-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .jump-btn { padding: 6px 10px; font-size: 12px; }
  .narrative-details { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 12px; }
  .narrative-details summary { cursor: pointer; font-weight: 760; }
  .narrative, .slot-fields { width: 100%; border-collapse: collapse; margin-top: 10px; }
  .narrative th, .narrative td, .slot-fields th, .slot-fields td { border-top: 1px solid var(--line); padding: 10px; vertical-align: top; text-align: left; font-size: 13px; }
  .narrative th[scope="row"], .slot-fields th[scope="row"] { color: var(--muted); width: 160px; white-space: nowrap; }
  .cell-text { display: block; line-height: 1.6; }
  .cell-confidence { display: block; color: var(--muted); font-size: 11px; margin-top: 3px; }
  .cell-verified { display: inline-block; color: var(--green); font-size: 11px; margin-left: 4px; }
  .cell-edit { display: block; margin-top: 6px; font: inherit; font-size: 12px; width: min(100%, 420px); border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; background: #fff; }
  .cell-verify { display: block; margin-top: 6px; font-size: 12px; color: var(--green); }
  .state-value { color: var(--ink); }
  .state-unknown { color: var(--muted); }
  .block-relations { margin-top: 12px; color: var(--muted); line-height: 1.7; }
  .story-slot { border: 1px solid var(--line); border-radius: 18px; padding: 14px; margin-top: 12px; background: rgba(255,255,255,0.72); }
  .story-slot header { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: flex-start; }
  .story-slot h3 { font-size: 18px; margin: 3px 0 0; letter-spacing: -0.02em; }
  .slot-blocks, .slot-rationale { color: var(--muted); margin: 8px 0 0; line-height: 1.65; }
  #validation-summary { margin: 14px clamp(18px, 4vw, 48px) 0; }
  #validation-summary h2 { font-size: 16px; margin: 0 0 4px; }
  #validation-summary pre { margin: 0; white-space: pre-wrap; }
  .correction-warnings { color: var(--accent-ink); margin: 6px 0 0; }
  #evidence-drawer {
    position: sticky;
    top: 74px;
    background: rgba(255,255,255,0.88);
    border: 1px solid var(--line);
    border-radius: 24px;
    padding: 16px;
    box-shadow: var(--shadow);
    font-size: 13px;
  }
  #evidence-drawer h2 { font-size: 17px; margin: 0 0 6px; }
  #evidence-drawer .drawer-hint { color: var(--muted); margin: 0 0 10px; line-height: 1.55; }
  #evidence-drawer code { word-break: break-all; font-size: 11px; }
  .drawer-frame { max-width: 100%; border-radius: 14px; margin-top: 6px; }
  @media (max-width: 960px) {
    .player-shell, .story-layout { grid-template-columns: 1fr; }
    #evidence-drawer { position: static; }
  }
</style>
</head>
<body>
<a class="skip-link" href="#story-overview">跳到故事总览</a>
<!--METADATA-->
<!--VALIDATION_SUMMARY-->
<div class="toolbar">
  <label for="loop-shot"><input type="checkbox" id="loop-shot"> 循环播放该镜头</label>
  <a class="link-button" href="shot-analysis.html">镜头审片页</a>
  <button type="button" id="export-corrections">导出校对记录</button>
  <button type="button" id="save-corrections" hidden>保存到本地</button>
  <button type="button" id="confirm-document">确认本次校对</button>
  <span id="pending-indicator" role="status" aria-live="polite"></span>
</div>
<section class="player-shell" aria-label="故事播放器">
  <video id="story-player" controls preload="none" aria-label="故事块镜头播放器"></video>
  <p class="player-copy">点击任意镜头卡片即可播放对应片段。Story 页面保留上一阶段的镜头证据，再叠加故事段与结构槽。</p>
</section>
<div class="story-layout">
<div class="main-col">
<!--STORY_OVERVIEW-->
<!--STORY_TIMELINE-->
<!--STORY_BLOCKS-->
<!--STORY_SLOTS-->
<!--SHOT_COVERAGE-->
</div>
<aside id="evidence-drawer" aria-label="证据与复核详情">
  <h2>追溯信息</h2>
  <p class="drawer-hint">点击叙事字段查看原始依据；镜头内容请直接在故事段里的镜头卡片中浏览。</p>
  <div id="evidence-drawer-content"></div>
</aside>
</div>
<script>
(function () {
  "use strict";
  window.__REVIEW_SERVER__ = __SERVER_MODE__;
  var DOCUMENT_TYPE = "storyAnalysis";
  var SOURCE_REVISION_ID = __SOURCE_REVISION_JS__;

  // ---- 播放器：定位镜头区间播放（可选循环）----
  var player = document.getElementById("story-player");
  var loopToggle = document.getElementById("loop-shot");
  var currentStartMs = 0;
  var currentEndMs = null;

  function playShot(src, startMs, endMs) {
    currentStartMs = startMs;
    currentEndMs = endMs;
    if (player.getAttribute("src") !== src) { player.setAttribute("src", src); }
    player.currentTime = startMs / 1000;
    player.play();
  }
  player.addEventListener("timeupdate", function () {
    if (currentEndMs === null) { return; }
    if (player.currentTime * 1000 >= currentEndMs) {
      if (loopToggle.checked) {
        player.currentTime = currentStartMs / 1000;
      } else {
        player.pause();
        currentEndMs = null;
      }
    }
  });
  Array.prototype.forEach.call(document.querySelectorAll(".jump-btn[data-clip-src]"), function (btn) {
    btn.addEventListener("click", function () {
      playShot(btn.getAttribute("data-clip-src"),
               parseInt(btn.getAttribute("data-start-ms"), 10) || 0,
               parseInt(btn.getAttribute("data-end-ms"), 10));
    });
  });

  // ---- 人工修正：pendingChanges 累积（entityID = block/slot/shot ID）----
  var pendingChanges = [];
  var indicator = document.getElementById("pending-indicator");
  function entityIDOf(el) {
    var value = el.getAttribute("data-entity-id") ||
      el.getAttribute("data-shot-id") ||
      el.getAttribute("data-block-id") ||
      el.getAttribute("data-slot-id");
    return value || null;
  }
  function sameKey(a, b) {
    return a.entityID === b.entityID && a.field === b.field &&
      (a.kind || "field") === (b.kind || "field");
  }
  function recordChange(change) {
    change.changedAt = new Date().toISOString();
    change.actor = "human";
    for (var i = pendingChanges.length - 1; i >= 0; i--) {
      if (sameKey(pendingChanges[i], change)) { pendingChanges.splice(i, 1); }
    }
    pendingChanges.push(change);
    indicator.textContent = "有 " + pendingChanges.length + " 项校对记录待保存";
  }
  window.addEventListener("beforeunload", function (event) {
    if (pendingChanges.length > 0) {
      event.preventDefault();
      event.returnValue = "";
    }
  });

  function cellOf(el) { return el.closest("td[data-field]"); }
  function currentVerified(td) {
    var box = td.querySelector(".verify-toggle");
    return box ? box.checked : false;
  }
  Array.prototype.forEach.call(document.querySelectorAll(".cell-edit"), function (control) {
    control.addEventListener("change", function () {
      var td = cellOf(control);
      var entityId = entityIDOf(control);
      if (!td || !entityId) { return; }
      var state, newValue;
      if (control.tagName === "SELECT") {
        if (control.value === "") { return; }  // 占位选项：尚未选择映射值
        if (control.value === "unknown") { state = "unknown"; newValue = null; }
        else { state = "value"; newValue = control.value; }
      } else {
        var text = control.value.trim();
        if (text === "") { state = "unknown"; newValue = null; }
        else { state = "value"; newValue = text; }
      }
      recordChange({
        entityID: entityId,
        field: control.getAttribute("data-field"),
        oldValue: control.getAttribute("data-initial-value") || null,
        newValue: newValue,
        state: state,
        verified: currentVerified(td)
      });
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll(".verify-toggle"), function (box) {
    box.addEventListener("change", function () {
      var td = cellOf(box);
      var entityId = entityIDOf(box);
      if (!td || !entityId) { return; }
      var control = td.querySelector(".cell-edit");
      var newValue = null;
      if (control && control.tagName !== "SELECT" && control.value.trim() !== "") {
        newValue = control.value.trim();
      } else if (control && control.tagName === "SELECT" &&
                 control.value !== "" && control.value !== "unknown") {
        newValue = control.value;
      }
      recordChange({
        entityID: entityId,
        field: box.getAttribute("data-field"),
        oldValue: control ? (control.getAttribute("data-initial-value") || null) : null,
        newValue: newValue,
        state: td.getAttribute("data-value-state"),
        verified: box.checked
      });
    });
  });

  // ---- corrections 导出 / 保存 / 确认 ----
  function correctionsPayload() {
    return {
      correctionVersion: 1,
      documentType: DOCUMENT_TYPE,
      sourceRevisionID: SOURCE_REVISION_ID,
      changes: pendingChanges
    };
  }
  document.getElementById("export-corrections").addEventListener("click", function () {
    var blob = new Blob([JSON.stringify(correctionsPayload(), null, 2)],
                        { type: "application/json" });
    var link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "corrections-" + DOCUMENT_TYPE + ".json";
    link.click();
    URL.revokeObjectURL(link.href);
  });
  var saveButton = document.getElementById("save-corrections");
  if (window.__REVIEW_SERVER__) { saveButton.hidden = false; }
  saveButton.addEventListener("click", function () {
    fetch("/api/corrections", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(correctionsPayload())
    }).then(function (resp) {
      if (resp.ok) {
        pendingChanges = [];
        indicator.textContent = "已保存到本地";
      } else {
        indicator.textContent = "保存失败：HTTP " + resp.status;
      }
    }).catch(function (err) {
      indicator.textContent = "保存失败：" + err;
    });
  });
  document.getElementById("confirm-document").addEventListener("click", function () {
    if (!window.__REVIEW_SERVER__) {
      indicator.textContent = "当前是离线页面：请先导出校对记录，再在应用中导入确认。";
      return;
    }
    fetch("/api/confirm", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ documentType: DOCUMENT_TYPE, sourceRevisionID: SOURCE_REVISION_ID })
    }).then(function (resp) {
      indicator.textContent = resp.ok ? "本次校对已确认" : "确认失败：HTTP " + resp.status;
    }).catch(function (err) {
      indicator.textContent = "确认失败：" + err;
    });
  });

  // ---- 证据抽屉：点击单元格显示证据引用 ----
  var drawer = document.getElementById("evidence-drawer-content");
  Array.prototype.forEach.call(document.querySelectorAll("td[data-field]"), function (td) {
    td.addEventListener("click", function (event) {
      if (event.target.closest("select, input, button, textarea, label, a")) { return; }
      var field = td.getAttribute("data-field");
      var entityId = entityIDOf(td) || "?";
      var fieldLabelNode = td.parentElement ? td.parentElement.querySelector("th") : null;
      var fieldLabel = fieldLabelNode ? fieldLabelNode.textContent : field;
      drawer.textContent = "";
      var heading = document.createElement("h3");
      heading.textContent = entityId + " · " + fieldLabel;
      drawer.appendChild(heading);
      var refs = (td.getAttribute("data-evidence-refs") || "").split(/\s+/);
      var list = document.createElement("ul");
      var hasRef = false;
      refs.forEach(function (ref) {
        if (!ref) { return; }
        hasRef = true;
        var item = document.createElement("li");
        if (/\.(jpe?g|png)$/i.test(ref)) {
          var img = document.createElement("img");
          img.setAttribute("src", ref);
          img.setAttribute("alt", entityId + " " + field + " 证据帧");
          img.className = "drawer-frame";
          item.appendChild(img);
        }
        var code = document.createElement("code");
        code.textContent = ref;
        item.appendChild(code);
        list.appendChild(item);
      });
      if (hasRef) {
        drawer.appendChild(list);
      } else {
        var none = document.createElement("p");
        none.textContent = "该字段暂无可展示依据。";
        drawer.appendChild(none);
      }
    });
  });
})();
</script>
</body>
</html>
